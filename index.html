function render(){let y=$('year').value,m=$('month').value;let years=[...new Set([...data.map(x=>x.date.slice(0,4)),String(new Date().getFullYear())])].sort();$('year').innerHTML=years.map(v=>`<option value="${v}">${v}</option>`).join('');$('year').value=years.includes(y)?y:String(new Date().getFullYear());$('month').innerHTML='<option value="all">Todos</option>'+Array.from({length:12},(_,i)=>{let n=String(i+1).padStart(2,'0');return `<option value="${n}">${new Date(2026,i,1).toLocaleString('es-ES',{month:'long'})}</option>`}).join('');$('month').value=m||String(new Date().getMonth()+1).padStart(2,'0');let running=0,balances={};for(const x of ordered()){running=money(running+delta(x));balances[x.id]=running}let selected=ordered().filter(x=>x.date.startsWith($('year').value)&&($('month').value==='all'||x.date.slice(5,7)===$('month').value)).reverse();let last=selected.at(-1);let end=$('month').value==='all'?$('year').value+'-12-31':$('year').value+'-'+$('month').value+'-'+String(new Date(Number($('year').value),Number($('month').value),0).getDate()).padStart(2,'0');let balance=money(ordered().filter(x=>x.date<=end).reduce((a,x)=>a+delta(x),0));$('balance').textContent=EUR(balance);$('periodLabel').textContent=$('month').value==='all'?'· '+$('year').value:'· '+$('month').selectedOptions[0].text+' '+$('year').value;

function openForm(id){editId=id||null;let x=id?data.find(v=>v.id===id):null;$('formTitle').textContent=x?'Editar sesión':'Nueva sesión';$('fdate').value=x?.date||[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-');$('fmode').value=x?(x.comp?'comp':(!x.pagado&&!x.costo?'cancel':'normal')):'normal';$('ftipo').value=['Physio','Occupation'].includes(x?.tipo)?x.tipo:'Physio';$('fterapeuta').value=x?.terapeuta||'';$('fcosto').value=x?.costo===65?'65':'48';$('fusuario').value=x?.usuario==='AK'?'AK':'CQ';$('fcomp').value=x?.comp||48;toggle();$('modal').classList.add('show')}
$('add').onclick=()=>openForm();$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};$('fmode').onchange=toggle;$('form').onsubmit=e=>{e.preventDefault();let mode=$('fmode').value;let x={id:editId||'new-'+Date.now(),date:$('fdate').value,tipo:mode==='cancel'?'cancelado':$('ftipo').value,terapeuta:$('fterapeuta').value.trim(),costo:mode==='normal'?Number($('fcosto').value):0,pagado:mode==='normal'?65:0,usuario:mode==='comp'?$('fusuario').value:'',comp:mode==='comp'?money($('fcomp').value):0,orden:editId?(data.find(v=>v.id===editId)?.orden||0):Math.max(21,...data.map(v=>v.orden||0))+1};if(editId)data=data.map(v=>v.id===editId?x:v);else data.push(x);$('modal').classList.remove('show');persist()};$('rows').onclick=$('mobile').onclick=e=>{let b=e.target.closest('[data-edit]');if(b)openForm(b.dataset.edit)};['year','month'].forEach(id=>$(id).onchange=render);
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}$('export').onclick=()=>download('terapias_cary_v10.json',JSON.stringify(data,null,2),'application/json');$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let a=JSON.parse(await f.text());if(!Array.isArray(a)||!a.every(x=>x.id&&x.date))throw Error('Formato incorrecto');if(confirm('¿Sustituir los datos actuales?')){data=a;persist()}}catch(err){alert('Error: '+err.message)}e.target.value=''};$('reset').onclick=()=>{if(confirm('¿Restaurar los 19 registros originales? Se perderán los cambios no guardados en una copia.')){data=clone(ORIGINAL);persist()}};$('print').onclick=()=>window.print();$('csv').onclick=()=>{let rows=[['Fecha','Tipo de tratamiento','Terapeuta','Costo real','Pagado','Usuario','Compensation','Dif.','Acumulado a favor']];let sum=0;for(let x of ordered()){sum=money(sum+delta(x));rows.push([x.date,x.tipo,x.terapeuta,x.costo,x.pagado,x.usuario,x.comp,delta(x),sum])}download('terapias_cary_v10.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')};$('year').value=String(new Date().getFullYear());$('month').value=String(new Date().getMonth()+1).padStart(2,'0');render();</script><script>if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{});}</script></body></html>
